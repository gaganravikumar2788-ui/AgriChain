<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Fonts for English, Hindi, and Kannada -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;600;700;900&family=Noto+Sans+Kannada:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
      .goog-te-banner-frame, #goog-gt-tt, .goog-te-balloon-frame {
        display: none !important;
      }
      body {
        top: 0px !important;
      }
      #google_translate_element {
        display: none;
      }
    </style>
    <title>AgriChain</title>
  </head>
  <body>
    <div id="google_translate_element" style="display:none"></div>
    <div id="root"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        try {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,kn',
            autoDisplay: false
          }, 'google_translate_element');
        } catch (e) {}
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
